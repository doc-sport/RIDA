<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16222E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LYRA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LYRA — Anglais en chansons</title>
<link rel="apple-touch-icon" id="icone-ios">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#16222E; --muted:#5C6C7B;
  --accent:#2148C0; --accent-soft:#E4EAFB; --warn:#C8401A; --warn-soft:#FBE8E1;
  --ok:#1E7F4F; --ok-soft:#E1F3E9; --amber:#B07207; --amber-soft:#FBF0DC;
  --violet:#5B3FA8; --violet-soft:#EDE7FB;
  --line:#DEE5EC; --shadow:0 1px 3px rgba(22,34,46,.08),0 6px 18px rgba(22,34,46,.06);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- En-tête ---------- */
header{background:var(--ink);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:40}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;max-width:880px;margin:0 auto;gap:12px}
.brand{font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:#9FB0C0;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.kpis{display:flex;gap:7px;align-items:flex-end}
.kpi{background:#243444;border:1px solid #35485C;border-radius:12px;padding:5px 10px 4px;text-align:center;min-width:56px}
.kpi .v{font-family:'IBM Plex Mono';font-weight:600;font-size:17px;line-height:1.1;color:#FFD44D}
.kpi .l{font-size:9.5px;color:#9FB0C0;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi.urg{background:#7A2E14;border-color:#A94425}

/* ---------- Onglets ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:21px;height:21px}
nav button.act{color:var(--accent)}
@media(min-width:720px){
  body{padding-bottom:20px}
  nav{position:sticky;top:64px;bottom:auto;max-width:880px;margin:12px auto 0;border:1px solid var(--line);border-radius:12px}
  nav button{flex-direction:row;gap:7px;font-size:13.5px;padding:11px}
}
main{max-width:880px;margin:0 auto;padding:14px 14px 30px}

/* ---------- Briques ---------- */
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;margin-bottom:12px}
.titre-sec{font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.titre-sec:first-child{margin-top:0}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.gris{background:#EEF1F5;color:var(--muted)}
.btn.dan{background:var(--warn-soft);color:var(--warn)}
.btn.ok{background:var(--ok);color:#fff}
.btn.plein{width:100%}
.btn.pt{padding:6px 10px;font-size:12.5px;border-radius:9px}
.rang{display:flex;gap:8px;flex-wrap:wrap}
.vide{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px;line-height:1.6}
.puce{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:#EEF1F5;color:var(--muted)}
.puce.a{background:var(--accent-soft);color:var(--accent)}
.puce.o{background:var(--ok-soft);color:var(--ok)}
.puce.w{background:var(--warn-soft);color:var(--warn)}
.puce.j{background:var(--amber-soft);color:var(--amber)}
.puce.v{background:var(--violet-soft);color:var(--violet)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.sep{height:1px;background:var(--line);margin:11px 0}

/* ---------- Textes ---------- */
.txt-e{display:flex;align-items:center;gap:11px;cursor:pointer}
.txt-e .ic{width:40px;height:40px;border-radius:11px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.txt-e .co{flex:1;min-width:0}
.txt-e .ti{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt-e .su{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Lecture ---------- */
.lect-barre{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.lect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 15px;font-size:var(--lect-fs,17px);line-height:2.1}
.lect .ligne{margin-bottom:3px;min-height:1.2em}
.lect .ligne.strophe{height:12px}
.lect .fr{display:block;font-size:13px;line-height:1.45;color:var(--muted);font-style:italic;margin:-4px 0 8px;padding-left:2px}
.w{border-radius:6px;padding:1px 2px;margin:0 -1.5px;cursor:pointer;transition:background .12s}
.w:hover{background:#EEF1F5}
.w.sel{background:var(--amber-soft);box-shadow:inset 0 -2px 0 var(--amber)}
.w.sel.b3{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.w.sel.b5{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:none;gap:8px;justify-content:center}
.selbar.on{display:flex}
.selbar button{background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(22,34,46,.3)}

/* ---------- Lexique ---------- */
.mot-e{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mot-e:last-child{border-bottom:none}
.sup{flex:none;color:var(--muted);font-size:17px;line-height:1;padding:6px 8px;border-radius:9px}
.sup:hover,.sup:active{background:var(--warn-soft);color:var(--warn)}
.mot-e .m{font-weight:600;font-size:15.5px}
.mot-e .p{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted)}
.mot-e .t{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mot-e .co{flex:1;min-width:0}
.boites{display:flex;gap:3px;flex:none}
.boites i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.boites i.on{background:var(--ok)}
.filtres{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.filtres button{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:#EEF1F5;color:var(--muted);white-space:nowrap}
.filtres button.act{background:var(--ink);color:#fff}

/* ---------- Modales ---------- */
.voile{position:fixed;inset:0;background:rgba(22,34,46,.5);z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0}
.voile.on{display:flex}
@media(min-width:720px){.voile{align-items:center;padding:20px}}
.modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:16px 15px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:720px){.modal{border-radius:18px;max-height:88vh}}
.m-titre{font-family:'Barlow Condensed';font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.m-titre button{font-size:26px;line-height:.8;color:var(--muted);padding:0 4px}

/* ---------- Fiche mot ---------- */
.fiche-tete{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fiche-mot{font-family:'Barlow Condensed';font-weight:700;font-size:34px;line-height:1.05}
.fiche-phon{font-family:'IBM Plex Mono';font-size:14px;color:var(--muted)}
.hp{background:var(--accent-soft);color:var(--accent);border-radius:999px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.trad-l{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.trad-l:last-child{border-bottom:none}
.trad-l b{font-size:15px}
.trad-l span{font-size:12.5px;color:var(--muted)}
.ex{background:#F6F8FA;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 11px;margin-bottom:8px}
.ex.src{border-left-color:var(--amber);background:var(--amber-soft)}
.ex .en{font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.ex .en b{font-weight:600}
.ex .fr{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px}
.ex .et{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:3px}

/* ---------- Quiz ---------- */
.q-voile{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column}
.q-voile.on{display:flex}
.q-tete{background:var(--ink);color:#fff;padding:12px 15px calc(12px);display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.q-tete .x{font-size:24px;line-height:.8;color:#9FB0C0}
.q-jauge{flex:1;height:8px;background:#35485C;border-radius:99px;overflow:hidden}
.q-jauge i{display:block;height:100%;background:#FFD44D;border-radius:99px;transition:width .3s}
.q-score{font-family:'IBM Plex Mono';font-weight:600;font-size:15px;color:#FFD44D;min-width:42px;text-align:right}
.q-corps{flex:1;overflow-y:auto;padding:18px 15px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;width:100%}
.q-consigne{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-enonce{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 16px;text-align:center;margin-bottom:16px}
.q-mot{font-family:'Barlow Condensed';font-weight:700;font-size:34px;line-height:1.1;word-break:break-word}
.q-phrase{font-size:17px;line-height:1.6}
.q-phrase .trou{display:inline-block;min-width:74px;border-bottom:2.5px solid var(--accent);vertical-align:-2px;margin:0 2px}
.q-sous{font-size:12.5px;color:var(--muted);margin-top:7px;font-style:italic}
.q-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:15px;font-weight:500;transition:transform .08s}
.q-opt:active{transform:scale(.99)}
.q-opt.bon{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.q-opt.mauv{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.q-fb{border-radius:12px;padding:12px 13px;margin-top:12px;font-size:13.5px;line-height:1.55}
.q-fb.bon{background:var(--ok-soft);color:var(--ok)}
.q-fb.mauv{background:var(--warn-soft);color:var(--warn)}
.q-fb b{display:block;font-size:15px;margin-bottom:3px}
.combo{font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em}
.q-fin{text-align:center;padding:10px 0}
.q-fin .gros{font-family:'Barlow Condensed';font-weight:700;font-size:58px;line-height:1;color:var(--accent)}
.q-fin .sub{font-size:14px;color:var(--muted);margin:6px 0 18px}
.barres{display:flex;align-items:flex-end;gap:6px;height:76px;margin:10px 0 4px}
.barres div{flex:1;background:var(--accent-soft);border-radius:5px 5px 0 0;position:relative;min-height:3px}
.barres div b{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted);font-weight:600}
.barres+.note{margin-top:20px}

/* ---------- Divers ---------- */
/* ---------- Lecteur Spotify ---------- */
.lecteur{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:45;display:none;
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(22,34,46,.10);padding:8px 12px 10px}
.lecteur.on{display:block}
@media(min-width:720px){.lecteur{bottom:0;max-width:880px;margin:0 auto;border:1px solid var(--line);border-radius:14px 14px 0 0}}
.lecteur-tete{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lecteur-tete b{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lecteur-tete a{font-size:11.5px;font-weight:600;color:var(--accent);text-decoration:none;flex:none}
.lecteur-tete button{font-size:20px;line-height:.8;color:var(--muted);padding:0 4px;flex:none}
.lecteur iframe{display:block;width:100%;height:80px;border:0;border-radius:12px}
body.avec-lecteur{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
@media(min-width:720px){body.avec-lecteur{padding-bottom:130px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.chargement{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:tourne .7s linear infinite}
.chargement.sombre{border-color:rgba(33,72,192,.25);border-top-color:var(--accent)}
@keyframes tourne{to{transform:rotate(360deg)}}
.expl{font-size:14px;line-height:1.6}
.expl p{margin-bottom:9px}
.expl b{font-weight:600}
.expl code{font-family:'IBM Plex Mono';font-size:13px;background:#EEF1F5;padding:1px 5px;border-radius:5px}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="brand">LYRA<small>Anglais · chansons &amp; poèmes</small></div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<nav id="nav">
  <button data-vue="textes" class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13" stroke-linecap="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Textes</button>
  <button data-vue="lexique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke-linejoin="round"/></svg>Lexique</button>
  <button data-vue="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a3 3 0 015.7 1c0 2-3 2.5-3 4" stroke-linecap="round"/><path d="M12 17.5h.01" stroke-linecap="round"/></svg>Quiz</button>
  <button data-vue="grammaire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13" stroke-linecap="round"/><path d="M18 15l2.5 2.5L18 20" stroke-linecap="round" stroke-linejoin="round"/></svg>Grammaire</button>
  <button data-vue="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34 1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87 1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>Réglages</button>
</nav>

<main id="main"></main>

<div class="lecteur" id="lecteur">
  <div class="lecteur-tete"><b id="lecteur-titre"></b><a id="lecteur-lien" target="_blank" rel="noopener">Ouvrir dans Spotify ↗</a><button id="lecteur-x" aria-label="Fermer le lecteur">×</button></div>
  <div id="lecteur-cadre"></div>
</div>

<div class="selbar" id="selbar">
  <button id="sel-mot">➕ Ajouter l'expression</button>
  <button id="sel-gram">❓ Expliquer la tournure</button>
</div>

<div class="voile" id="v-mot"><div class="modal" id="mot-corps"></div></div>
<div class="voile" id="v-regle"><div class="modal" id="regle-corps"></div></div>
<div class="voile" id="v-form"><div class="modal" id="form-corps"></div></div>
<div class="q-voile" id="v-quiz">
  <div class="q-tete">
    <button class="x" id="q-quitter" aria-label="Quitter">×</button>
    <div class="q-jauge"><i id="q-jauge"></i></div>
    <div class="q-score" id="q-score">0</div>
  </div>
  <div class="q-corps" id="q-corps"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   LYRA — apprendre l'anglais à partir de chansons et de poèmes
   Application autonome : tout est stocké sur cet appareil.
   ============================================================ */
const $=id=>document.getElementById(id);
const CLE='lyra';
const JOUR=86400000;
/* Répétition espacée (Leitner) : délai avant la prochaine révision, par boîte */
const DELAIS=[0,0,1,3,7,21];
const NATURES=['nom','verbe','adjectif','adverbe','expression','préposition','conjonction','pronom','interjection','autre'];

/* ---------- Utilitaires ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function echap(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m,ms){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms||2600); }
function ouvrir(id){ $(id).classList.add('on'); }
function fermer(id){ $(id).classList.remove('on'); }
function aujourdhui(){ return new Date().toISOString().slice(0,10); }
/* Normalisation d'un mot : minuscules, sans ponctuation ni accent */
function norm(m){
  return String(m||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,'').replace(/^'+|'+$/g,'').trim();
}
/* Comparaison souple pour les réponses écrites */
function souple(s){ return norm(s).replace(/[^a-z0-9]/g,''); }
function melanger(t){ const a=t.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pioche(t,n){ return melanger(t).slice(0,n); }

/* ---------- État ---------- */
function neuf(){
  return { textes:[], mots:[], regles:[],
    reglages:{ claudeKey:'', effort:'medium', voix:'', debit:.9, longueur:10, taille:17 },
    stats:{ jours:{}, serie:0, dernierJour:'' },
    version:1, maj:Date.now() };
}
function charger(){
  try{
    const b=localStorage.getItem(CLE);
    if(!b) return neuf();
    const e=JSON.parse(b);
    const d=neuf();
    return Object.assign(d, e, { reglages:Object.assign(d.reglages, e.reglages||{}), stats:Object.assign(d.stats, e.stats||{}) });
  }catch(x){ return neuf(); }
}
function persister(){
  etat.maj=Date.now();
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }
  catch(x){ toast('Mémoire pleine : exporte tes données dans Réglages'); }
}
let etat=charger();
let vue='textes', lectureId=null, filtreLex='tous', rechLex='';

/* ---------- Prononciation (synthèse vocale) ---------- */
let voix=[];
function chargerVoix(){ try{ voix=speechSynthesis.getVoices()||[]; }catch(x){ voix=[]; } }
chargerVoix();
try{ speechSynthesis.onvoiceschanged=chargerVoix; }catch(x){}
function voixAnglaise(){
  if(!voix.length) chargerVoix();
  const pref=etat.reglages.voix;
  return voix.find(v=>v.name===pref) || voix.find(v=>/^en[-_]GB/i.test(v.lang)) || voix.find(v=>/^en/i.test(v.lang)) || null;
}
function parler(txt){
  if(!txt) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(txt));
    const v=voixAnglaise(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
    u.rate=Number(etat.reglages.debit)||.9;
    speechSynthesis.speak(u);
  }catch(x){ toast('Synthèse vocale indisponible sur cet appareil'); }
}
window.dire=function(enc){ parler(decodeURIComponent(enc)); };

/* ---------- Répétition espacée ---------- */
function dus(liste){ const t=Date.now(); return liste.filter(o=>o.fiche!==false && (o.du||0)<=t); }
function classer(o,juste){
  o.vus=(o.vus||0)+1;
  if(juste){ o.ok=(o.ok||0)+1; o.boite=Math.min(5,(o.boite||1)+1); }
  else{ o.ko=(o.ko||0)+1; o.boite=Math.max(1,(o.boite||1)-1); }
  o.du=Date.now()+DELAIS[o.boite]*JOUR;
}
function motsPrets(){ return etat.mots.filter(m=>m.statut==='fiche' && (m.trads||[]).length); }
function marquerJour(juste){
  const j=aujourdhui(), s=etat.stats;
  if(!s.jours[j]) s.jours[j]={q:0,ok:0};
  s.jours[j].q++; if(juste) s.jours[j].ok++;
  if(s.dernierJour!==j){
    const hier=new Date(Date.now()-JOUR).toISOString().slice(0,10);
    s.serie = (s.dernierJour===hier)? (s.serie||0)+1 : 1;
    s.dernierJour=j;
  }
}

/* ---------- En-tête ---------- */
function rendreKpis(){
  const prets=motsPrets();
  const aRev=dus(prets).length + dus(etat.regles).length;
  $('kpis').innerHTML=
    '<div class="kpi"><div class="v">'+etat.mots.length+'</div><div class="l">mots</div></div>'+
    '<div class="kpi'+(aRev?' urg':'')+'"><div class="v">'+aRev+'</div><div class="l">à réviser</div></div>'+
    '<div class="kpi"><div class="v">'+(etat.stats.serie||0)+'</div><div class="l">série</div></div>';
}

/* ---------- Routage ---------- */
function rendre(){
  rendreKpis();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('act', b.dataset.vue===vue));
  const m=$('main');
  if(vue==='textes')        m.innerHTML = lectureId? vueLecture() : vueTextes();

  else                      m.innerHTML = vueReglages();
  brancher();
  window.scrollTo(0, vue==='textes'&&lectureId? window._sy||0 : 0);
}
function aller(v){ vue=v; lectureId=null; window._sy=0; rendre(); }

/* ---------- Lecteur Spotify ----------
   L'iframe vit hors de <main> : elle survit aux réaffichages, donc la
   musique continue pendant qu'on clique sur les mots ou qu'on révise. */
function spotifyEmbed(u){
  const t=String(u||'').trim();
  let m=t.match(/^spotify:(track|album|playlist|episode|show):([A-Za-z0-9]+)/);
  if(!m) m=t.match(/^https?:\/\/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
  return m? 'https://open.spotify.com/embed/'+m[1]+'/'+m[2] : null;
}
let lecteurTexteId=null;
window.ouvrirLecteur=function(id){
  const t=etat.textes.find(x=>x.id===(id||lectureId));
  if(!t || !t.spotify) return;
  const src=spotifyEmbed(t.spotify);
  if(!src){ toast('Lien Spotify non reconnu'); return; }
  if(lecteurTexteId!==t.id){
    lecteurTexteId=t.id;
    $('lecteur-cadre').innerHTML='<iframe src="'+echap(src)+'" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>';
    $('lecteur-titre').textContent=t.titre||'';
    $('lecteur-lien').href=t.spotify;
  }
  $('lecteur').classList.add('on');
  document.body.classList.add('avec-lecteur');
};
window.fermerLecteur=function(){
  $('lecteur').classList.remove('on');
  document.body.classList.remove('avec-lecteur');
  $('lecteur-cadre').innerHTML=''; lecteurTexteId=null;
};
window.retourTextes=function(){ lectureId=null; rendre(); };

/* ---------- Découpage du texte en mots cliquables ---------- */
function morceaux(ligne){ return ligne.match(/[A-Za-zÀ-ɏ'’\-]+|[^A-Za-zÀ-ɏ'’\-]+/g)||[]; }
function indexMots(){
  const ix={};
  etat.mots.forEach(m=>{ const k=norm(m.mot); if(k && !ix[k]) ix[k]=m; if(m.lemme){ const l=norm(m.lemme); if(l && !ix[l]) ix[l]=m; } });
  return ix;
}
function vueLecture(){
  const t=etat.textes.find(x=>x.id===lectureId);
  if(!t){ lectureId=null; return vueTextes(); }
  const ix=indexMots();
  const aFaire=etat.mots.filter(m=>m.texteId===t.id && m.statut!=='fiche').length;
  const lignes=t.texte.split('\n');
  let corps='';
  lignes.forEach((ligne,li)=>{
    if(!ligne.trim()){ corps+='<div class="ligne strophe"></div>'; return; }
    let h='';
    morceaux(ligne).forEach(mo=>{
      const k=norm(mo);
      if(k && /[a-z]/i.test(mo)){
        const m=ix[k];
        const cl='w'+(m?' sel b'+(m.statut==='fiche'?(m.boite||1):1):'');
        h+='<span class="'+cl+'" data-l="'+li+'">'+echap(mo)+'</span>';
      }else h+=echap(mo);
    });
    corps+='<div class="ligne" data-l="'+li+'">'+h+'</div>';
    if(t.trad && t.voirTrad && t.trad[li]) corps+='<span class="fr">'+echap(t.trad[li])+'</span>';
  });
  return '<div class="lect-barre">'+
    '<button class="btn gris pt" onclick="retourTextes()">‹ Textes</button>'+
    '<button class="btn sec pt" onclick="lireTexte()">🔊 Écouter</button>'+
    '<button class="btn '+(t.trad&&t.voirTrad?'':'sec ')+'pt" onclick="traduireTexte()">'+
      (!t.trad? '🈯 Traduire (IA)' : t.voirTrad? '🇬🇧 Version anglaise' : '🇫🇷 Version traduite')+'</button>'+
    (t.spotify? '<button class="btn sec pt" onclick="ouvrirLecteur()">🎧 Écouter le titre</button>':'')+
    (aFaire?'<button class="btn pt" onclick="enrichirLot(\''+t.id+'\')">✨ Enrichir '+aFaire+' mot'+(aFaire>1?'s':'')+'</button>':'')+
    '<button class="btn gris pt" onclick="formTexte(\''+t.id+'\')">✎</button>'+
    '</div>'+
    '<div class="carte" style="padding:11px 13px"><div class="note">👆 <b>Clique sur chaque mot que tu ne connais pas</b> : il rejoint ton lexique. Sélectionne plusieurs mots pour ajouter une expression ou faire expliquer une tournure. Reclique sur un mot surligné pour ouvrir sa fiche.</div></div>'+
    '<div class="titre-sec">'+echap(t.titre)+(t.auteur?' <span class="note" style="font-weight:400;text-transform:none">'+echap(t.auteur)+'</span>':'')+'</div>'+
    '<div class="lect" id="lect" style="--lect-fs:'+(etat.reglages.taille||17)+'px">'+corps+'</div>';
}

/* ---------- Ajout / ouverture d'un mot depuis le texte ---------- */
function ligneDe(t,li){ return (t.texte.split('\n')[li]||'').trim(); }
function ajouterMot(expr, texteId, li){
  const t=etat.textes.find(x=>x.id===texteId);
  const cle=norm(expr);
  if(!cle) return null;
  const dejala=etat.mots.find(m=>norm(m.mot)===cle);
  if(dejala) return dejala;
  const m={ id:uid(), mot:expr.replace(/^[^A-Za-zÀ-ɏ']+|[^A-Za-zÀ-ɏ']+$/g,''),
    lemme:'', nature:'', phon:'', trads:[], exemples:[], piege:'', collocs:[],
    texteId:texteId, titreTexte:t?t.titre:'', ligne:li==null?'':ligneDe(t,li), ligneFr:'',
    statut:'brut', boite:1, du:Date.now(), vus:0, ok:0, ko:0, cree:Date.now() };
  etat.mots.push(m); persister();
  return m;
}
function brancherLecture(){
  const z=$('lect'); if(!z) return;
  z.addEventListener('click', e=>{
    const s=e.target.closest('.w'); if(!s) return;
    if((window.getSelection().toString()||'').trim().split(/\s+/).length>1) return;
    const mot=s.textContent, li=Number(s.dataset.l);
    const ex=etat.mots.find(m=>norm(m.mot)===norm(mot)||(m.lemme&&norm(m.lemme)===norm(mot)));
    window._sy=window.scrollY;
    if(ex){ ficheMot(ex.id); return; }
    const m=ajouterMot(mot, lectureId, li);
    if(m){ s.classList.add('sel','b1'); rendreKpis(); majBarreEnrichir(); toast('« '+m.mot+' » ajouté au lexique'); }
  });
  const barre=$('selbar');
  const verif=()=>{
    const sel=(window.getSelection().toString()||'').trim();
    const dans=window.getSelection().rangeCount && z.contains(window.getSelection().getRangeAt(0).commonAncestorContainer);
    barre.classList.toggle('on', !!(sel && dans && sel.split(/\s+/).length>=1 && sel.length>1));
    barre._sel=sel;
    barre._l=(()=>{ try{ const n=window.getSelection().getRangeAt(0).startContainer;
      const e=n.nodeType===1?n:n.parentElement; const p=e.closest('[data-l]'); return p?Number(p.dataset.l):null; }catch(x){ return null; } })();
  };
  ['mouseup','touchend','keyup'].forEach(ev=>z.addEventListener(ev,()=>setTimeout(verif,10)));
  document.addEventListener('selectionchange',()=>{ if($('lect')) setTimeout(verif,10); });
}
function majBarreEnrichir(){
  const b=document.querySelector('.lect-barre'); if(!b||!lectureId) return;
  const t=etat.textes.find(x=>x.id===lectureId); if(!t) return;
  const aFaire=etat.mots.filter(m=>m.texteId===t.id && m.statut!=='fiche').length;
  const old=b.querySelector('.btn:not(.gris):not(.sec)');
  if(aFaire && !old){ const btn=document.createElement('button'); btn.className='btn pt'; btn.onclick=()=>enrichirLot(t.id); b.insertBefore(btn, b.lastElementChild); }
  const cible=b.querySelector('.btn:not(.gris):not(.sec)');
  if(cible) cible.textContent='✨ Enrichir '+aFaire+' mot'+(aFaire>1?'s':'');
}

/* ============================================================
   2. INTELLIGENCE ARTIFICIELLE (Claude) — fiches de vocabulaire,
      traduction du texte et explications de grammaire
   ============================================================ */
function cleIA(){ return (etat.reglages.claudeKey||'').replace(/\s+/g,''); }
/* Traduit une erreur HTTP de l'API en message compréhensible */
function messageErreur(statut, detail){
  const d=(detail||'').toLowerCase();
  if(statut===401) return 'Clé refusée (401) : elle est incomplète, révoquée, ou appartient à un autre compte. Recrée-en une sur console.anthropic.com → API Keys.';
  if(statut===403) return "Accès refusé (403) : cette clé n'a pas le droit d'appeler l'API Messages.";
  if(statut===400 && d.indexOf('credit')>=0) return 'Crédit épuisé : recharge le compte sur console.anthropic.com → Billing.';
  if(statut===429) return 'Trop de requêtes d\'affilée (429) : attends une minute et réessaie.';
  if(statut>=500) return 'Serveur Anthropic momentanément indisponible ('+statut+') : réessaie dans un instant.';
  return 'Erreur '+statut+(detail?' — '+detail:'');
}
async function appelIA(systeme, message, schema, effort){
  const cle=cleIA();
  if(!cle) throw new Error('Aucune clé API : renseigne-la dans Réglages');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':cle,'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true','anthropic-beta':'server-side-fallback-2026-07-01'},
    body:JSON.stringify({ model:'claude-opus-5', max_tokens:8000, fallbacks:'default',
      output_config:{ effort:effort||etat.reglages.effort||'medium', format:{type:'json_schema',schema:schema} },
      system:systeme, messages:[{role:'user',content:message}] })
  });
  if(!r.ok){
    let d=''; try{ const j=await r.json(); d=(j.error&&j.error.message)||''; }catch(x){}
    throw new Error(messageErreur(r.status,d));
  }
  const j=await r.json();
  if(j.stop_reason==='refusal') throw new Error('la requête a été refusée');
  const bloc=(j.content||[]).find(b=>b.type==='text');
  if(!bloc) throw new Error('réponse vide');
  return JSON.parse(bloc.text);
}

      properties:{fr:{type:'string',description:'Traduction française'},nuance:{type:'string',description:"Contexte d'emploi, registre ou nuance, en une courte phrase française. Vide si évident."}}}},

    sensDansLeTexte:{type:'string',description:"Le sens précis qu'a le mot dans le vers fourni, en français, une phrase."},

    collocations:{type:'array',description:'Au plus 4 collocations. Tableau vide si rien de notable.',items:{type:'string',description:'Expression ou collocation courante avec ce mot, suivie de sa traduction entre parenthèses'}}

async function ficheIA(m){
  const t=etat.textes.find(x=>x.id===m.texteId);
  const sys=[
    "Tu es professeur d'anglais pour un francophone adulte, curieux et exigeant.",
    "On te donne un mot ou une expression en anglais relevé dans "+(t?('« '+(t.titre||'un texte')+' »'+(t.auteur?' de '+t.auteur:'')):'un texte')+", ainsi que le vers d'où il provient.",
    "Tu produis une fiche de vocabulaire en français.",
    "traductions : de la plus courante à la plus rare ; ajoute la nuance d'emploi quand elle est utile.",
    "exemples : 2 phrases courantes et naturelles, la première très simple, la seconde plus riche. N'y recopie jamais le vers du texte (il sera ajouté automatiquement à la suite).",
    "Sois précis et concis : ce sont des fiches à réviser, pas un cours."
  ].join('\n');
  const msg='Mot : '+m.mot+(m.ligne?('\nVers : '+m.ligne):'\n(pas de vers fourni)');
  const o=await appelIA(sys,msg,SCHEMA_MOT);
  m.lemme=o.lemme||''; m.nature=o.nature||''; m.phon=o.phonetique||'';
  m.trads=(o.traductions||[]).map(x=>({fr:x.fr,nuance:x.nuance||''}));
  m.exemples=(o.exemples||[]).map(x=>({en:x.en,fr:x.fr,src:false}));
  if(m.ligne) m.exemples.push({en:m.ligne,fr:o.traductionLigne||'',src:true});
  m.sens=o.sensDansLeTexte||''; m.piege=o.piege||''; m.collocs=o.collocations||[];
  m.statut='fiche'; m.du=Date.now();
  persister();
  return m;
}
window.enrichirMot=async function(id){
  const m=etat.mots.find(x=>x.id===id); if(!m) return;
  const b=$('b-enrichir'); if(b){ b.disabled=true; b.innerHTML='<span class="chargement"></span> Fiche en cours…'; }
  try{ await ficheIA(m); ficheMot(id); toast('Fiche complétée'); rendreKpis(); }
  catch(e){ toast('IA : '+e.message, 4200); if(b){ b.disabled=false; b.textContent='✨ Compléter avec l\'IA'; } }
};
window.enrichirLot=async function(texteId){
  if(!cleIA()){ toast('Ajoute ta clé API dans Réglages pour utiliser l\'IA', 3800); return; }
  const liste=etat.mots.filter(m=>(!texteId||m.texteId===texteId) && m.statut!=='fiche');
  if(!liste.length){ toast('Tous les mots ont déjà leur fiche'); return; }
  let n=0, err=0, dernier='';
  for(const m of liste){
    toast('Fiches en cours… '+(n+1)+'/'+liste.length, 60000);
    try{ await ficheIA(m); n++; }
    catch(e){
      err++; dernier=e.message;
      /* Inutile d'insister quand la clé ou le crédit est en cause */
      if(/refusée|Crédit|Accès refusé/.test(dernier) || err>=3) break;
    }
  }
  persister(); rendre();
  if(!n && dernier) toast(dernier, 8000);
  else toast(n+' fiche'+(n>1?'s':'')+' complétée'+(n>1?'s':'')+(err?' · '+err+' échec'+(err>1?'s':''):''), 3800);
};

const SCHEMA_TRAD={type:'object',additionalProperties:false,required:['lignes'],
  properties:{lignes:{type:'array',items:{type:'object',additionalProperties:false,required:['n','fr'],

window.traduireTexte=async function(){
  const t=etat.textes.find(x=>x.id===lectureId); if(!t) return;
  /* La traduction est conservée : le bouton ne fait qu'alterner les deux versions */
  if(t.trad){ t.voirTrad=!t.voirTrad; persister(); rendre(); return; }
  if(!cleIA()){ toast('Ajoute ta clé API dans Réglages pour utiliser l\'IA', 3800); return; }
  const lignes=t.texte.split('\n');
  const num=lignes.map((l,i)=>({i:i,l:l})).filter(o=>o.l.trim());
  toast('Traduction en cours…', 60000);
  try{
    const sys="Tu traduis en français un texte de chanson ou un poème anglais, vers par vers, pour un apprenant francophone.\n"+
      "Traduction fidèle et naturelle, pas de paraphrase littéraire libre : elle doit aider à comprendre le sens exact de chaque vers.\n"+
      "Renvoie une traduction pour chaque numéro fourni, sans en omettre aucun.";
    const msg=(t.titre?('Titre : '+t.titre+'\n'):'')+(t.auteur?('Auteur : '+t.auteur+'\n\n'):'\n')+
      num.map(o=>o.i+' | '+o.l).join('\n');
    const o=await appelIA(sys,msg,SCHEMA_TRAD);
    const tr={}; (o.lignes||[]).forEach(x=>{ tr[x.n]=x.fr; });
    t.trad=tr; t.voirTrad=true; persister(); rendre(); toast('Traduction affichée — le bouton alterne les deux versions');
  }catch(e){ toast('IA : '+e.message, 4200); }
};

function etatMot(m){
  if(m.statut!=='fiche') return '<span class="puce j">à compléter</span>';
  if((m.boite||1)>=5) return '<span class="puce o">acquis</span>';
  if((m.du||0)<=Date.now()) return '<span class="puce w">à réviser</span>';
  return '<span class="puce a">boîte '+(m.boite||1)+'</span>';
}
function pointsBoite(b){ let h='<div class="boites">'; for(let i=1;i<=5;i++) h+='<i class="'+(i<=(b||1)?'on':'')+'"></i>'; return h+'</div>'; }

window.ficheMot=function(id){
  const m=etat.mots.find(x=>x.id===id); if(!m) return;
  const t=etat.textes.find(x=>x.id===m.texteId);
  let h='<div class="m-titre"><span>Fiche de vocabulaire</span><button onclick="fermer(\'v-mot\')">×</button></div>';
  h+='<div class="fiche-tete"><span class="fiche-mot">'+echap(m.mot)+'</span>'+
     '<button class="hp" onclick="dire(\''+encodeURIComponent(m.mot)+'\')" aria-label="Écouter">🔊</button>'+
     (m.phon?'<span class="fiche-phon">'+echap(m.phon)+'</span>':'')+'</div>';
  h+='<div class="rang" style="margin:8px 0 4px">'+etatMot(m)+
     (m.nature?'<span class="puce v">'+echap(m.nature)+'</span>':'')+
     (m.lemme&&norm(m.lemme)!==norm(m.mot)?'<span class="puce">base : '+echap(m.lemme)+'</span>':'')+
     (m.vus?'<span class="puce">'+(m.ok||0)+'/'+m.vus+' réussites</span>':'')+'</div>';

  if(m.statut!=='fiche'){
    h+='<div class="sep"></div><div class="note">Ce mot attend sa fiche : traductions, exemples et piège éventuel.</div>'+
       '<div class="rang" style="margin-top:12px"><button class="btn" id="b-enrichir" style="flex:1" onclick="enrichirMot(\''+m.id+'\')">✨ Compléter avec l\'IA</button>'+

  }else{
    h+='<div class="sep"></div><div class="titre-sec" style="margin:0 0 4px">Traductions</div>';
    (m.trads||[]).forEach(tr=>{ h+='<div class="trad-l"><b>'+echap(tr.fr)+'</b>'+(tr.nuance?'<span>'+echap(tr.nuance)+'</span>':'')+'</div>'; });
    if(m.sens) h+='<div class="note" style="margin-top:8px">🎯 <b>Dans ce texte</b> : '+echap(m.sens)+'</div>';
    if((m.collocs||[]).length) h+='<div class="note" style="margin-top:8px">🔗 '+m.collocs.map(c=>echap(c)).join(' · ')+'</div>';
    if(m.piege) h+='<div class="note" style="margin-top:8px;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:9px">⚠️ '+echap(m.piege)+'</div>';
    h+='<div class="titre-sec" style="margin:16px 0 6px">Exemples</div>';
    (m.exemples||[]).forEach(ex=>{
      h+='<div class="ex'+(ex.src?' src':'')+'">'+(ex.src?'<div class="et">'+echap(t?('« '+t.titre+' »'):'le texte')+'</div>':'')+

       '<button class="btn gris pt" onclick="rejouerMot(\''+m.id+'\')">↺ À revoir</button>'+
       '<button class="btn dan pt" onclick="supprimerMot(\''+m.id+'\')">Supprimer</button></div>';
  }

  $('mot-corps').innerHTML=h;
  ouvrir('v-mot');
};
/* Met le mot en gras dans une phrase d'exemple */
function surligner(phrase,m){
  const cles=[norm(m.mot),norm(m.lemme)].filter(Boolean);
  return morceaux(phrase).map(mo=>{
    const k=norm(mo);
    return (k&&cles.some(c=>k===c||(c.length>3&&k.startsWith(c))))? '<b>'+echap(mo)+'</b>' : echap(mo);
  }).join('');
}

window.enregistrerMot=function(id){
  const m=etat.mots.find(x=>x.id===id); if(!m) return;
  const coupe=s=>{ const i=s.indexOf('|'); return i<0? [s.trim(),''] : [s.slice(0,i).trim(), s.slice(i+1).trim()]; };
  m.mot=$('e-mot').value.trim()||m.mot;
  m.lemme=$('e-lemme').value.trim(); m.nature=$('e-nature').value; m.phon=$('e-phon').value.trim();
  m.trads=$('e-trads').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const c=coupe(l); return {fr:c[0],nuance:c[1]}; });
  const srcAvant=(m.exemples||[]).filter(e=>e.src).map(e=>e.en);
  m.exemples=$('e-ex').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const c=coupe(l); return {en:c[0],fr:c[1],src:srcAvant.indexOf(c[0])>=0}; });
  m.piege=$('e-piege').value.trim();
  if(m.trads.length) m.statut='fiche';
  persister(); fermer('v-form'); ficheMot(id); rendre();
};

const SCHEMA_REGLE={type:'object',additionalProperties:false,
  required:['titre','explication','structure','exemples','pieges','quiz'],
  properties:{
    titre:{type:'string',description:'Nom court de la règle ou de la tournure, en français (ex : « Le present perfect avec since et for »)'},
    explication:{type:'string',description:"Explication claire en français, structurée en 2 à 5 paragraphes séparés par un retour à la ligne. Pars de l'exemple donné, puis généralise. Compare au français quand c'est éclairant."},
    structure:{type:'string',description:'La formule de la structure, ex : « sujet + have/has + participe passé ». Vide si sans objet.'},
    exemples:{type:'array',description:'De 2 à 4 exemples illustrant la règle.',items:{type:'object',additionalProperties:false,required:['en','fr'],
      properties:{en:{type:'string'},fr:{type:'string'}}}},
    pieges:{type:'string',description:"Erreurs typiques d'un francophone sur ce point. Vide si rien à signaler."},
    quiz:{type:'array',description:'De 3 à 6 questions portant sur la règle expliquée.',items:{type:'object',additionalProperties:false,required:['question','options','bonne','explication'],
      properties:{
        question:{type:'string',description:'Question ou phrase à trous (utilise ___ pour le trou), en anglais ou en français selon ce qui est testé'},
        options:{type:'array',description:'3 ou 4 réponses possibles, dont une seule correcte.',items:{type:'string'}},
        bonne:{type:'integer',description:'Index (à partir de 0) de la bonne réponse dans options'},
        explication:{type:'string',description:'Pourquoi cette réponse est la bonne, en une ou deux phrases françaises'}}}}
  }};

window.demanderRegle=async function(id){

  const sys=[

  ].join('\n');

      quiz:(o.quiz||[]).filter(q=>q.options&&q.options.length&&q.bonne>=0&&q.bonne<q.options.length) });
    if(!base) etat.regles.push(r);
    persister(); fermer('v-form'); vue='grammaire'; rendre(); ficheRegle(r.id);

  h+='<div class="carte" style="text-align:center">'+

     '<button class="btn gris pt" onclick="lancerQuiz(\'mixte\')">Tout mélanger</button></div></div>';

  if(etat.textes.length){
    h+='<div class="titre-sec">Par texte</div><div class="carte"><div class="rang">'+
      etat.textes.map(x=>{ const n=etat.mots.filter(m=>m.texteId===x.id&&m.statut==='fiche').length;
        return n? '<button class="btn sec pt" onclick="lancerQuiz(\'txt:'+x.id+'\')">'+echap(x.titre)+' ('+n+')</button>':''; }).join('')+
      '</div></div>';

  /* Progression */
  const boites=[0,0,0,0,0]; prets.forEach(m=>{ boites[Math.min(5,m.boite||1)-1]++; });
  const maxB=Math.max(1,...boites);
  h+='<div class="titre-sec">Progression</div><div class="carte">'+
     '<div class="barres">'+boites.map((v,i)=>'<div style="height:'+Math.round(6+94*v/maxB)+'%'+(i===4?';background:var(--ok-soft)':'')+'"><b>'+(i===4?'acquis':'b'+(i+1))+'</b></div>').join('')+'</div>'+
     '<div class="note">'+prets.length+' mot'+(prets.length>1?'s':'')+' en apprentissage'+(brut?' · '+brut+' fiche'+(brut>1?'s':'')+' à compléter':'')+' · '+etat.regles.length+' règle'+(etat.regles.length>1?'s':'')+'</div></div>';

  const js=Object.keys(etat.stats.jours||{}).sort().slice(-7);
  if(js.length){

      return '<div style="height:'+Math.round(6+94*o.q/maxJ)+'%"><b>'+j.slice(8)+'/'+j.slice(5,7)+'</b></div>';
    }).join('')+'</div><div class="note">Questions par jour — 7 derniers jours actifs. Série en cours : '+(etat.stats.serie||0)+' jour'+((etat.stats.serie||0)>1?'s':'')+'.</div></div>';
  }
  return h;
}

/* ---------- Fabrication des questions ---------- */
function trad1(m){ return ((m.trads||[])[0]||{}).fr||''; }
function distracteurs(m, pool, champ, n){
  const bon=champ==='fr'? trad1(m).toLowerCase() : norm(m.mot);
  const vus={};
  return pioche(pool.filter(x=>x.id!==m.id),24)
    .map(x=>champ==='fr'? trad1(x) : x.mot)
    .filter(v=>{ const k=v.toLowerCase(); if(!v||k===bon||vus[k]) return false; vus[k]=1; return true; })
    .slice(0,n);
}
function trouer(phrase,m){
  const cles=[norm(m.mot),norm(m.lemme)].filter(Boolean);
  let trouve=false;
  const h=morceaux(phrase).map(mo=>{
    const k=norm(mo);
    if(k && cles.some(c=>k===c||(c.length>3&&k.indexOf(c)===0))){ trouve=true; return '<span class="trou"></span>'; }
    return echap(mo);
  }).join('');
  return trouve? h : null;
}
function questionsMot(m, pool){
  const qs=[], fr=trad1(m), tr=(m.trads||[]).map(x=>x.fr).join(', ');
  const rappel='<b>'+echap(m.mot)+'</b> — '+echap(tr||fr);
  const dis=distracteurs(m,pool,'fr',3), disEn=distracteurs(m,pool,'en',3);
  if(fr && dis.length>=2){
    const opts=melanger([fr].concat(dis));
    qs.push({cible:m, consigne:'Que veut dire ce mot ?', mode:'qcm', gros:m.mot, dire:m.mot,
      options:opts, bonne:opts.indexOf(fr), expl:rappel});
  }
  if(fr && disEn.length>=2){
    const opts=melanger([m.mot].concat(disEn));
    qs.push({cible:m, consigne:'Comment dit-on en anglais ?', mode:'qcm', gros:fr,
      options:opts, bonne:opts.indexOf(m.mot), expl:rappel, dire:m.mot});
  }
  const ex=(m.exemples||[]).filter(e=>trouer(e.en,m));
  if(ex.length && disEn.length>=2){
    const e=pioche(ex,1)[0], opts=melanger([m.mot].concat(disEn));
    qs.push({cible:m, consigne:'Complète la phrase', mode:'qcm', phrase:trouer(e.en,m), sous:e.fr||'',
      options:opts, bonne:opts.indexOf(m.mot), expl:rappel+'<br>'+echap(e.en), dire:e.en});
  }
  if(fr){
    qs.push({cible:m, consigne:'Écris le mot anglais', mode:'saisie', gros:fr, sous:(m.nature?'('+m.nature+')':''),
      reponses:[m.mot].concat(m.lemme?[m.lemme]:[]), expl:rappel, dire:m.mot});
  }
  if(fr && dis.length>=2 && 'speechSynthesis' in window){
    const opts=melanger([fr].concat(dis));
    qs.push({cible:m, consigne:'Écoute puis choisis la traduction', mode:'qcm', ecoute:m.mot,
      options:opts, bonne:opts.indexOf(fr), expl:rappel, dire:m.mot});
  }
  return qs;
}
function questionsRegle(r){
  return (r.quiz||[]).map(q=>({ cible:r, consigne:'Grammaire — '+r.titre, mode:'qcm',
    phrase:echap(q.question).replace(/_{2,}/g,'<span class="trou"></span>'),
    options:q.options.slice(), bonne:q.bonne, expl:echap(q.explication||''), dire:null }));
}
window.lancerQuiz=function(src){
  const t=Date.now(), n=Number(etat.reglages.longueur)||10;
  const prets=motsPrets();
  let mots=[], regles=[];
  if(src.indexOf('regle:')===0){ const r=etat.regles.find(x=>x.id===src.slice(6)); if(r) regles=[r]; }
  else if(src.indexOf('txt:')===0){ mots=prets.filter(m=>m.texteId===src.slice(4)); }
  else if(src==='vocab'){ mots=prets; }
  else if(src==='gram'){ regles=etat.regles.filter(r=>(r.quiz||[]).length); }
  else if(src==='du'){ mots=prets.filter(m=>(m.du||0)<=t); regles=etat.regles.filter(r=>(r.quiz||[]).length&&(r.du||0)<=t); }
  else { mots=prets; regles=etat.regles.filter(r=>(r.quiz||[]).length); }

  /* On complète une séance trop courte avec des mots pas encore dus */
  let choixMots=melanger(mots);
  if(src==='du' && choixMots.length+regles.length<n) choixMots=choixMots.concat(melanger(prets.filter(m=>choixMots.indexOf(m)<0)));

  const liste=[];
  choixMots.forEach(m=>{ const qs=questionsMot(m,prets); if(qs.length) liste.push(pioche(qs,1)[0]); });
  melanger(regles).forEach(r=>{ const qs=melanger(questionsRegle(r)); qs.slice(0, src.indexOf('regle:')===0? 99 : 2).forEach(q=>liste.push(q)); });
  const final=(src.indexOf('regle:')===0? liste : melanger(liste)).slice(0, src.indexOf('regle:')===0? liste.length : n);
  if(!final.length){ toast('Pas encore assez de fiches complétées pour un quiz'); return; }
  Q={liste:final, i:0, score:0, justes:0, combo:0, meilleur:0, erreurs:[], repondu:false};
  ouvrir('v-quiz'); rendreQuestion();
};
$('q-quitter').onclick=function(){
  if(Q && !Q.fini && Q.i<Q.liste.length && !confirm('Quitter la séance en cours ?')) return;
  fermer('v-quiz'); Q=null; rendre();
};

function rendreQuestion(){
  const q=Q.liste[Q.i];
  $('q-jauge').style.width=Math.round(100*Q.i/Q.liste.length)+'%';
  $('q-score').textContent=Q.score;
  Q.repondu=false;
  let enonce='';
  if(q.ecoute) enonce='<button class="hp" style="width:64px;height:64px;font-size:28px" onclick="dire(\''+encodeURIComponent(q.ecoute)+'\')">🔊</button><div class="q-sous">Appuie pour réécouter</div>';
  else if(q.phrase) enonce='<div class="q-phrase">'+q.phrase+'</div>'+(q.sous?'<div class="q-sous">'+echap(q.sous)+'</div>':'');
  else enonce='<div class="q-mot">'+echap(q.gros||'')+'</div>'+(q.sous?'<div class="q-sous">'+echap(q.sous)+'</div>':'');

  let h='<div class="q-consigne"><span>'+echap(q.consigne)+'</span><span>'+(Q.i+1)+'/'+Q.liste.length+
        (Q.combo>=2?' <span class="combo">🔥 x'+Q.combo+'</span>':'')+'</span></div>'+
        '<div class="q-enonce">'+enonce+'</div><div id="q-rep">';
  if(q.mode==='qcm') h+=q.options.map((o,i)=>'<button class="q-opt" data-i="'+i+'">'+echap(o)+'</button>').join('');
  else h+='<input id="q-saisie" placeholder="En anglais…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">'+
          '<div class="rang" style="margin-top:10px"><button class="btn" style="flex:1" id="q-valider">Vérifier</button>'+
          '<button class="btn gris" id="q-passe">Je ne sais pas</button></div>';
  h+='</div><div id="q-fb"></div>';
  $('q-corps').innerHTML=h;
  if(q.ecoute) setTimeout(()=>parler(q.ecoute),350);
  if(q.mode==='qcm'){
    $('q-rep').querySelectorAll('.q-opt').forEach(b=>b.onclick=()=>repondre(Number(b.dataset.i)));
  }else{
    const inp=$('q-saisie'); inp.focus();
    inp.onkeydown=e=>{ if(e.key==='Enter') repondre(inp.value); };
    $('q-valider').onclick=()=>repondre(inp.value);
    $('q-passe').onclick=()=>repondre('');
  }
}
function repondre(rep){
  if(Q.repondu) return; Q.repondu=true;
  const q=Q.liste[Q.i];
  let juste;
  if(q.mode==='qcm'){
    juste = rep===q.bonne;
    $('q-rep').querySelectorAll('.q-opt').forEach((b,i)=>{
      if(i===q.bonne) b.classList.add('bon');
      else if(i===rep) b.classList.add('mauv');
      b.onclick=null;
    });
  }else{
    juste = (q.reponses||[]).some(r=>souple(r)===souple(rep));
    $('q-saisie').disabled=true; $('q-valider').disabled=true; $('q-passe').disabled=true;
  }
  if(juste){ Q.justes++; Q.combo++; Q.meilleur=Math.max(Q.meilleur,Q.combo); Q.score+=10+Math.min(10,(Q.combo-1)*2); }
  else{ Q.combo=0; Q.erreurs.push(q); }
  classer(q.cible, juste); marquerJour(juste); persister();

  const bonneTxt = q.mode==='qcm'? q.options[q.bonne] : (q.reponses||[])[0];
  $('q-fb').innerHTML='<div class="q-fb '+(juste?'bon':'mauv')+'"><b>'+(juste?'✅ Exact !':'❌ Réponse : '+echap(bonneTxt))+'</b>'+
    (q.expl||'')+'</div>'+
    '<div class="rang" style="margin-top:12px">'+
    (q.dire?'<button class="btn sec" onclick="dire(\''+encodeURIComponent(q.dire)+'\')">🔊</button>':'')+
    (q.cible && q.cible.mot? '<button class="btn gris" onclick="ficheMot(\''+q.cible.id+'\')">Voir la fiche</button>':
     (q.cible&&q.cible.titre? '<button class="btn gris" onclick="ficheRegle(\''+q.cible.id+'\')">Voir la fiche</button>':''))+
    '<button class="btn" style="flex:1" id="q-suite">'+(Q.i+1>=Q.liste.length?'Voir le résultat':'Suivant ›')+'</button></div>';
  $('q-suite').focus();
  $('q-suite').onclick=()=>{ Q.i++; if(Q.i>=Q.liste.length) rendreFin(); else rendreQuestion(); };
  if(q.dire && juste && q.mode!=='saisie' && !q.ecoute) parler(q.dire);
  rendreKpis();
}
function rendreFin(){
  Q.fini=true;
  $('q-jauge').style.width='100%';
  const n=Q.liste.length, pct=Math.round(100*Q.justes/n);
  const mot = pct>=90? 'Impeccable !' : pct>=70? 'Très bien.' : pct>=50? 'Ça vient.' : 'À retravailler.';
  let h='<div class="q-fin"><div class="gros">'+Q.justes+'/'+n+'</div>'+
    '<div class="sub">'+mot+' '+Q.score+' points'+(Q.meilleur>=3?' · meilleure série 🔥 x'+Q.meilleur:'')+'</div></div>';
  if(Q.erreurs.length){
    h+='<div class="titre-sec">À revoir ('+Q.erreurs.length+')</div><div class="carte">';
    Q.erreurs.forEach(q=>{
      const c=q.cible;
      h+='<div class="mot-e" onclick="'+(c.mot?'ficheMot':'ficheRegle')+'(\''+c.id+'\')"><div class="co">'+
         '<div class="m">'+echap(c.mot||c.titre)+'</div><div class="t">'+echap(c.mot? (c.trads||[]).map(x=>x.fr).join(', ') : (c.structure||c.extrait||''))+'</div></div>'+
         '<span class="puce w">raté</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="rang" style="margin-top:14px">'+
     (Q.erreurs.length?'<button class="btn" style="flex:1" id="q-rejouer">↺ Rejouer les erreurs</button>':'')+
     '<button class="btn '+(Q.erreurs.length?'gris':'')+'" style="flex:1" id="q-fin-ok">Terminer</button></div>';
  $('q-corps').innerHTML=h;
  $('q-fin-ok').onclick=()=>{ fermer('v-quiz'); Q=null; rendre(); };
  if($('q-rejouer')) $('q-rejouer').onclick=()=>{
    Q={liste:melanger(Q.erreurs), i:0, score:Q.score, justes:0, combo:0, meilleur:0, erreurs:[], repondu:false};
    rendreQuestion();
  };
}

function apercuCle(k){ return k.length>16? k.slice(0,11)+'…'+k.slice(-4) : k; }
window.testerCle=async function(){
  const b=$('r-test'); if(!b) return;
  b.disabled=true; b.innerHTML='<span class="chargement sombre"></span> Test en cours…';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':cleIA(),'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5',max_tokens:16,messages:[{role:'user',content:'ping'}]})
    });
    if(r.ok) toast('✅ Clé valide, l\'IA est opérationnelle');
    else{ let d=''; try{ const j=await r.json(); d=(j.error&&j.error.message)||''; }catch(x){} toast(messageErreur(r.status,d), 8000); }
  }catch(e){ toast('Connexion impossible : '+e.message, 6000); }
  b.disabled=false; b.textContent='🔌 Tester la clé';
};
window.cleDepuisRida=function(){
  try{
    const r=JSON.parse(localStorage.getItem('rida')||'{}');
    const k=((r.settings||{}).claudeKey||'').replace(/\s+/g,'');
    if(!k){ toast('Aucune clé trouvée dans RIDA'); return; }
    etat.reglages.claudeKey=k; persister(); rendre(); toast('Clé récupérée');
  }catch(x){ toast('Lecture impossible'); }
};
function telecharger(nom, contenu, type){
  const b=new Blob([contenu],{type:type||'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nom;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
window.exporter=function(){ telecharger('lyra-'+aujourdhui()+'.json', JSON.stringify(etat,null,1)); toast('Sauvegarde téléchargée'); };
window.exporterCsv=function(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const l=['mot;traductions;nature;prononciation;exemple;traduction exemple;texte'];
  etat.mots.forEach(m=>{
    const ex=(m.exemples||[]).slice(-1)[0]||{};
    l.push([m.mot,(m.trads||[]).map(x=>x.fr).join(', '),m.nature||'',m.phon||'',ex.en||'',ex.fr||'',m.titreTexte||''].map(q).join(';'));
  });
  telecharger('lexique-'+aujourdhui()+'.csv','﻿'+l.join('\n'),'text/csv');
  toast('Lexique exporté');
};
window.toutEffacer=function(){
  if(!confirm('Effacer tous les textes, mots et règles de cet appareil ?')) return;
  if(!confirm('Confirmation : cette action est définitive. As-tu fait une sauvegarde ?')) return;
  localStorage.removeItem(CLE); etat=neuf(); lectureId=null; vue='textes'; rendre(); toast('Données effacées');
};

/* ---------- Écouteurs propres à chaque vue ---------- */
function brancher(){
  if(vue==='textes' && lectureId) brancherLecture();
  const r=$('lex-rech');
  if(r) r.oninput=()=>{ rechLex=r.value; const p=r.selectionStart; rendre(); const n=$('lex-rech'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const cle=$('r-cle');
  if(cle){ const maj=()=>{ etat.reglages.claudeKey=cle.value.replace(/\s+/g,''); persister(); };
    cle.oninput=maj; cle.onchange=maj; cle.onblur=()=>{ maj(); rendre(); }; }
  const oeil=$('r-oeil');
  if(oeil) oeil.onclick=()=>{ const c=$('r-cle'); c.type = c.type==='password'? 'text':'password'; oeil.textContent = c.type==='password'? '👁':'🙈'; };
  const test=$('r-test'); if(test) test.onclick=testerCle;
  const ef=$('r-effort'); if(ef) ef.onchange=()=>{ etat.reglages.effort=ef.value; persister(); };
  const vx=$('r-voix'); if(vx) vx.onchange=()=>{ etat.reglages.voix=vx.value; persister(); };
  const db=$('r-debit'); if(db) db.oninput=()=>{ etat.reglages.debit=Number(db.value); $('r-debit-v').textContent=db.value; persister(); };
  const lo=$('r-long'); if(lo) lo.oninput=()=>{ etat.reglages.longueur=Number(lo.value); $('r-long-v').textContent=lo.value; persister(); };
  const ta=$('r-taille'); if(ta) ta.oninput=()=>{ etat.reglages.taille=Number(ta.value); $('r-taille-v').textContent=ta.value+' px'; persister(); };
  const im=$('r-import');
  if(im) im.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const o=JSON.parse(fr.result);
        if(!o || !Array.isArray(o.mots)) throw new Error('format');
        if(!confirm('Remplacer les données actuelles par cette sauvegarde ?\n'+(o.textes||[]).length+' texte(s), '+o.mots.length+' mot(s).')) return;
        etat=Object.assign(neuf(), o); persister(); lectureId=null; rendre(); toast('Sauvegarde restaurée');
      }catch(x){ toast('Fichier illisible'); }
    };
    fr.readAsText(f);
  };
}
document.querySelectorAll('.voile').forEach(v=>v.addEventListener('click', e=>{ if(e.target===v) fermer(v.id); }));
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ document.querySelectorAll('.voile.on').forEach(v=>fermer(v.id)); } });
